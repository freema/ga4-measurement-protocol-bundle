version: '3'

vars:
  COMPOSE_FILE: docker-compose.yml
  COMPOSE: docker compose
  CONTAINER_NAME: ga4-measurement-protocol-bundle-php
  TEST_DIR: .symfony-test

tasks:
  # Setup Development Environment
  init:
    desc: 'Initialize development environment completely'
    cmds:
      - task: up
      - task: vendor:install
      - task: composer:dump-autoload
      - echo "Development environment initialized successfully!"
    aliases: ['i', 'setup']

  vendor:install:
    desc: 'Install vendor dependencies'
    cmd: |
      docker exec -it {{ .CONTAINER_NAME }} sh -c "
        if ! command -v composer > /dev/null 2>&1; then
          echo 'Installing Composer...'
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        fi
        composer install --no-interaction
      "
    aliases: ['composer:install', 'install']
    
  composer:dump-autoload:
    desc: 'Update composer autoloader'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} composer dump-autoload'
    aliases: ['dump-autoload', 'autoload']

  # Docker Management
  up:
    desc: 'Start development environment'
    cmd: |
      {{ .COMPOSE }} up -d
    aliases: ['u']

  down:
    desc: 'Stop development environment'
    cmd: '{{ .COMPOSE }} down'
    aliases: ['d']

  restart:
    desc: 'Restart development environment'
    cmds:
      - task: down
      - task: up
    aliases: ['r']

  # Development Tasks
  php:shell:
    desc: 'Open shell in PHP container'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} bash'
    aliases: ['sh']

  dev:serve:
    desc: 'Start development server'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} php -S 0.0.0.0:8080 -t dev/'
    aliases: ['serve']

  # Test matrix, the same PHP / Symfony pairs as CI (.github/workflows/ci.yml).
  # Each run uses throwaway containers, so it does not need `task up`:
  # Composer resolves the dependencies for the target PHP, Symfony Flex pins
  # the Symfony version (SYMFONY_REQUIRE), and PHPUnit runs on that PHP.
  test:matrix:
    internal: true
    vars:
      DIR: '{{ .TEST_DIR }}/php{{ .PHP }}'
    cmds:
      - rm -rf {{ .DIR }}
      - mkdir -p {{ .DIR }}
      - cp -r src tests composer.json phpunit.xml.dist {{ .DIR }}/
      - >-
        docker run --rm -v "$PWD/{{ .DIR }}":/app -w /app
        -v "$HOME/.composer/cache":/tmp/composer-cache -e COMPOSER_CACHE_DIR=/tmp/composer-cache
        -e SYMFONY_REQUIRE='{{ .SYMFONY }}' composer:2 sh -c "
        composer global config --no-plugins allow-plugins.symfony/flex true &&
        composer global require --quiet symfony/flex &&
        composer config platform.php {{ .PHP }}.99 &&
        composer update --no-interaction --no-progress"
      - docker run --rm -v "$PWD/{{ .DIR }}":/app -w /app php:{{ .PHP }}-cli vendor/bin/phpunit

  test:symfony54:
    desc: 'Test with Symfony 5.4 on PHP 8.1'
    cmds:
      - task: test:matrix
        vars: { PHP: '8.1', SYMFONY: '5.4.*' }
    aliases: ['t:54']

  test:symfony64:
    desc: 'Test with Symfony 6.4 on PHP 8.2'
    cmds:
      - task: test:matrix
        vars: { PHP: '8.2', SYMFONY: '6.4.*' }
    aliases: ['t:64']

  test:symfony74:
    desc: 'Test with Symfony 7.4 on PHP 8.3'
    cmds:
      - task: test:matrix
        vars: { PHP: '8.3', SYMFONY: '7.4.*' }
    aliases: ['t:74']

  test:symfony8:
    desc: 'Test with Symfony 8 on PHP 8.5'
    cmds:
      - task: test:matrix
        vars: { PHP: '8.5', SYMFONY: '8.*' }
    aliases: ['t:8']

  test:all:
    desc: 'Test with all Symfony versions'
    cmds:
      - task: test:symfony54
      - task: test:symfony64
      - task: test:symfony74
      - task: test:symfony8
    aliases: ['t:all']

  test:cleanup:
    desc: 'Clean test environment'
    cmd: rm -rf {{ .TEST_DIR }}
    aliases: ['t:clean']

  # Code Quality
  stan:
    desc: 'Run PHPStan analysis'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} vendor/bin/phpstan analyse src'
    aliases: ['lint']

  cs:fix:
    desc: 'Fix code style'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} vendor/bin/php-cs-fixer fix'
    aliases: ['fix', 'fixer']

  test:
    desc: 'Run PHPUnit tests'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} vendor/bin/phpunit'
    aliases: ['t']

  default:
    desc: 'Show available commands'
    cmds:
      - task --list